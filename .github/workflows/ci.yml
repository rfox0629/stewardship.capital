name: Actions Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Register GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm workflow registration
        run: |
          echo "GitHub Actions bootstrap workflow registered."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
